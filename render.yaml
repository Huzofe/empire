services:
  - type: web
    name: empire-app
    env: node
    region: frankfurt
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: empire-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: empire-db
          property: connectionString
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: NODE_ENV
        value: production

databases:
  - name: empire-db
    databaseName: empire
    user: empire
    plan: free
    region: frankfurt
